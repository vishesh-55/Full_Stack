<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YourStore - Checkout</title>

    <!-- CSS FILE -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- HEADER -->
    <header>

        <div class="logo">
            YourStore
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="cart.html">
                Cart
            </a>

        </nav>

    </header>


    <main>

        <h1 class="page-title">
            Checkout
        </h1>


        <!-- CHECKOUT FORM -->

        <form class="checkout-form">


            <!-- NAME -->

            <label for="name">
                Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >


            <!-- ADDRESS -->

            <label for="address">
                Address
            </label>

            <textarea
                id="address"
                name="address"
                rows="4"
                placeholder="Enter your complete address"
                required
            ></textarea>


            <!-- CITY -->

            <label for="city">
                City
            </label>

            <input
                type="text"
                id="city"
                name="city"
                placeholder="Enter your city"
                required
            >


            <!-- PINCODE -->

            <label for="pincode">
                Pincode
            </label>

            <input
                type="text"
                id="pincode"
                name="pincode"
                placeholder="Enter 6 digit pincode"
                maxlength="6"
                required
            >


            <!-- PHONE -->

            <label for="phone">
                Phone
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                required
            >


            <!-- PAYMENT METHOD -->

            <h3>
                Payment Method
            </h3>


            <div class="payment-option">

                <input
                    type="radio"
                    id="cod"
                    name="payment"
                    value="Cash on Delivery"
                    required
                >

                <label for="cod">
                    Cash on Delivery
                </label>

            </div>


            <div class="payment-option">

                <input
                    type="radio"
                    id="upi"
                    name="payment"
                    value="UPI"
                >

                <label for="upi">
                    UPI
                </label>

            </div>


            <div class="payment-option">

                <input
                    type="radio"
                    id="card"
                    name="payment"
                    value="Credit/Debit Card"
                >

                <label for="card">
                    Credit/Debit Card
                </label>

            </div>


            <br>


            <!-- SUBMIT BUTTON -->

            <button
                type="submit"
                class="place-order-button"
            >
                Place Order
            </button>

        </form>

    </main>


    <!-- FOOTER -->

    <footer>

        <p>
            Contact: support@yourstore.com
        </p>

        <p>
            Phone: +91 9876543210
        </p>

        <p>
            &copy; 2026 YourStore. All Rights Reserved.
        </p>

    </footer>

</body>

</html>
